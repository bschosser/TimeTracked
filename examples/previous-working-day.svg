    <text x="64" y="120" font-size="11" font-weight="700" fill="#7a898a" letter-spacing="2">PERSONAL TIME LEDGER · NOV 13</text>
    <text x="64" y="166" font-size="38" font-weight="700" letter-spacing="-1.5">Time, Tracked</text>
    <text x="64" y="192" font-size="13" fill="#7a898a">A quiet estimate of working time, with a local pause switch.</text>
  </g>
