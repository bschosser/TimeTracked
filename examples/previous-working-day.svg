    <rect x="92" y="340" width="465" height="5" rx="2" fill="#344340"/><rect x="92" y="340" width="310" height="5" rx="2" fill="#fa896f"/>
    <text x="92" y="360" font-size="10" fill="#b9c8c0">78% OF OBSERVED TIME</text><text x="502" y="360" font-size="10" fill="#b9c8c0">52 SAMPLES</text>
  </g>
  <rect x="607" y="220" width="529" height="150" rx="3" fill="#263638"/>
