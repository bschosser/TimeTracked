<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1290" role="img" aria-labelledby="title desc">
  <title id="title">Desk Signal previous working day dashboard</title>
  <desc id="desc">Illustrative work signal dashboard with a previous working day timeline, app setting, average day, and weekly history.</desc>
  <rect width="1200" height="1290" fill="#f5f7f2"/>
  <rect width="1200" height="9" fill="#172326"/>
  <g font-family="Arial, sans-serif" fill="#172326">
